<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1421"/>
      <stop offset="100%" stop-color="#070c14"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c8dff"/>
      <stop offset="50%" stop-color="#a77bf3"/>
      <stop offset="100%" stop-color="#36d7ea"/>
    </linearGradient>
    <linearGradient id="python-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#387eb8"/>
      <stop offset="100%" stop-color="#4c8dff"/>
    </linearGradient>
    <linearGradient id="python-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffbf69"/>
      <stop offset="100%" stop-color="#ffd43b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4c8dff" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded App Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#glow)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Visual graph node connections -->
  <g stroke="#1d2a3d" stroke-width="4" stroke-dasharray="8 8">
    <line x1="140" y1="180" x2="256" y2="120" />
    <line x1="256" y1="120" x2="372" y2="180" />
    <line x1="140" y1="332" x2="256" y2="392" />
    <line x1="256" y1="392" x2="372" y2="332" />
  </g>

  <!-- Glowing node points -->
  <circle cx="140" cy="180" r="10" fill="#36d7ea" opacity="0.8"/>
  <circle cx="372" cy="180" r="10" fill="#55dca3" opacity="0.8"/>
  <circle cx="140" cy="332" r="10" fill="#a77bf3" opacity="0.8"/>
  <circle cx="372" cy="332" r="10" fill="#ff6b7a" opacity="0.8"/>

  <!-- Python Visual / Code Badge in center -->
  <g transform="translate(136, 136) scale(0.47)" filter="url(#shadow)">
    <!-- Blue snake segment -->
    <path fill="url(#python-blue)" d="M255.5 0C116.8 0 126.8 60.1 126.8 60.1l.1 62.4h131.6v18.7H74.4S0 131.3 0 268.4c0 137.2 64.8 131.9 64.8 131.9h38.7v-54.7s-2.1-64.8 63.7-64.8h131.5s60.6 1 60.6-59V60.1S369.8 0 255.5 0zm-71.1 41.2c12.7 0 23 10.3 23 23s-10.3 23-23 23-23-10.3-23-23c0-12.8 10.3-23 23-23z"/>
    <!-- Yellow snake segment -->
    <path fill="url(#python-yellow)" d="M256.5 512c138.7 0 128.7-60.1 128.7-60.1l-.1-62.4H253.5v-18.7h184.1s74.4 9.9 74.4-127.2c0-137.2-64.8-131.9-64.8-131.9h-38.7v54.7s2.1 64.8-63.7 64.8H213.3s-60.6-1-60.6 59v162.7s-10.5 60.1 103.8 60.1zm71.1-41.2c-12.7 0-23-10.3-23-23s10.3-23 23-23 23 10.3 23 23c0 12.8-10.3 23-23 23z"/>
  </g>

  <!-- Live Pulse Dot -->
  <circle cx="410" cy="102" r="12" fill="#55dca3"/>
  <circle cx="410" cy="102" r="22" fill="none" stroke="#55dca3" stroke-width="3" opacity="0.5"/>
</svg>
